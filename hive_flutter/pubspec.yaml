name: hive_flutter
description: Extension for Hive. Makes it easier to use Hive in Flutter apps.
version: 2.0.0-dev
homepage: https://github.com/hivedb/hive/tree/master/hive_flutter
documentation: https://docs.hivedb.dev/

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cryptography: ^2.7.0
  hive: ^3.0.0-dev
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  test: ^1.25.14
  lints: ">=1.0.0"
  mockito: ^5.4.5
  build_runner: ^2.4.14
